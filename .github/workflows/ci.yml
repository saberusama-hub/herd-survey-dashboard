name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt in early to the Node 24 actions runtime ahead of GitHub's forced
# migration on 2026-06-16. Catches any incompatibility now rather than
# waking up to a broken pipeline.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      # Axe a11y audit against the built static export. Runs cleanly on the
      # Linux CI runner — locally on macOS it deadlocks on the DuckDB-WASM
      # worker interaction (see docs/qa/qa-report-2026-06-02.md).
      - name: Serve static export
        run: |
          python3 -m http.server -d apps/web/out 3000 &
          for i in {1..20}; do
            curl -sf http://localhost:3000/ > /dev/null && break
            sleep 1
          done
      - name: Run axe a11y smoke
        run: |
          # ubuntu-latest runners ship google-chrome preinstalled; fall back
          # to chromium-browser or apt-installed chromium if absent.
          set -x
          which google-chrome || true
          which google-chrome-stable || true
          which chromium || true
          which chromium-browser || true
          ls -la /usr/bin/google* 2>/dev/null || true
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then
            echo "No Chrome on PATH; installing chromium via apt..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq chromium-browser || sudo apt-get install -y -qq chromium
            CHROME=$(command -v chromium || command -v chromium-browser)
          fi
          echo "Using Chrome: $CHROME"
          CHROME="$CHROME" node scripts/qa/axe_smoke.js

      - name: Bundle size budget check
        run: |
          MAX_GZ_KB=250
          MAX_PARQUET_MB=50
          fail=0
          echo "## JS chunks (gzipped, must be ≤ ${MAX_GZ_KB} KB each)"
          for f in apps/web/out/_next/static/chunks/*.js; do
            gz=$(gzip -c "$f" | wc -c)
            kb=$((gz / 1024))
            printf '  %-60s %5d KB gz\n' "$(basename "$f")" "$kb"
            if [ "$kb" -gt "$MAX_GZ_KB" ]; then
              echo "  ✗ FAIL: $(basename "$f") = ${kb} KB gz > ${MAX_GZ_KB} KB"
              fail=1
            fi
          done
          echo ""
          echo "## Parquets (must be ≤ ${MAX_PARQUET_MB} MB each)"
          for f in apps/web/public/data/*.parquet; do
            mb=$(($(stat -c%s "$f") / 1024 / 1024))
            printf '  %-60s %4d MB\n' "$(basename "$f")" "$mb"
            if [ "$mb" -gt "$MAX_PARQUET_MB" ]; then
              echo "  ✗ FAIL: $(basename "$f") = ${mb} MB > ${MAX_PARQUET_MB} MB"
              fail=1
            fi
          done
          exit $fail

      # Lighthouse: perf / a11y / best-practices / seo with hard thresholds.
      # Conservative perf threshold (0.5) because the WASM + parquet bundle is
      # heavier than a typical static site on simulated slow-4G.
      - name: Lighthouse audit
        run: |
          set -x
          # Use pnpm dlx (resolves through pnpm's store — npm install collides
          # with pnpm's symlink node_modules layout). dlx caches per-version.
          mkdir -p /tmp/lh-bin
          cd /tmp/lh-bin
          pnpm init -y >/dev/null
          pnpm add lighthouse@12 chrome-launcher@1
          cd "${GITHUB_WORKSPACE}"
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)" \
          NODE_PATH=/tmp/lh-bin/node_modules \
            node scripts/qa/lighthouse_ci.js
        env:
          THRESH_PERFORMANCE: '0.5'
          THRESH_ACCESSIBILITY: '0.9'
          THRESH_BEST_PRACTICES: '0.9'
          THRESH_SEO: '0.9'

  cross-browser:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Install Playwright browsers
        run: pnpm dlx playwright@1.49 install --with-deps chromium firefox webkit

      - name: Serve static export
        run: |
          python3 -m http.server -d apps/web/out 3000 &
          for i in {1..20}; do
            curl -sf http://localhost:3000/ > /dev/null && break
            sleep 1
          done

      - name: Cross-browser smoke (chromium + firefox + webkit)
        run: pnpm dlx playwright@1.49 -- node scripts/qa/cross_browser.js
