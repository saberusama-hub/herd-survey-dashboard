name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt in early to the Node 24 actions runtime ahead of GitHub's forced
# migration on 2026-06-16. Catches any incompatibility now rather than
# waking up to a broken pipeline.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
